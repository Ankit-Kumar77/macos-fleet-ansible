---
# ==============================================================================
# Universal Global Variables & Default Settings
# ==============================================================================

# User Management (Configurable for any organization or setup)
mac_automation_user: "{{ lookup('env', 'USER') | default('admin') }}"
mac_admin_group: "admin"
mac_developer_group: "_developer"

# Dynamic User Creation List (Easily scale/add more users in the future)
mac_additional_users: []

# Base Directory Structure (Dynamic based on target user home)
mac_user_home: "/Users/{{ mac_automation_user }}"
common_base_directories:
  - "/usr/local/bin"
  - "{{ mac_user_home }}/.config"
  - "{{ mac_user_home }}/bin"
  - "{{ mac_user_home }}/var/log"

# Base Packages (Common Role)
common_homebrew_packages:
  - git
  - curl
  - wget
  - jq
  - htop
  - tree
  - cmake
  - ninja
  - python@3.11

common_homebrew_casks: []

# Homebrew Paths
homebrew_prefix_arm64: "/opt/homebrew"
homebrew_prefix_x86_64: "/usr/local"

# Security Toggles
security_set_hostname: true
security_enable_firewall: true
security_enable_stealth_mode: true
security_sshd_disable_root: true
security_sshd_disable_password_auth: true
security_enable_autoupdate: true
security_configure_pmset: true
security_sleep_display_minutes: 15
security_sleep_disk_minutes: 30
