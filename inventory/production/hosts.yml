---
all:
  children:
    # --- Base Fleet Definition ---
    common_nodes:
      hosts:
        mac-mini-01:
          ansible_host: 192.168.1.101
        mac-mini-02:
          ansible_host: 192.168.1.102
        mac-mini-03:
          ansible_host: 192.168.1.103
        mac-mini-04:
          ansible_host: 192.168.1.104
        mac-mini-05:
          ansible_host: 192.168.1.105

    ios_builders:
      hosts:
        mac-mini-01:
        mac-mini-03:
        mac-mini-06:
        mac-mini-07:

    android_builders:
      hosts:
        mac-mini-02:
        mac-mini-03:
        mac-mini-08:
        mac-mini-09:

    llm_nodes:
      hosts:
        mac-mini-01:
        mac-mini-02:
        mac-mini-10:
        mac-mini-11:

    secure_nodes:
      children:
        common_nodes:

  vars:
    # Universal SSH user - set to your target user (e.g., admin, devops, ci-user)
    ansible_user: "{{ mac_automation_user | default('admin') }}"
    ansible_ssh_private_key_file: "{{ mac_ssh_private_key_path | default('~/.ssh/id_ed25519') }}"
