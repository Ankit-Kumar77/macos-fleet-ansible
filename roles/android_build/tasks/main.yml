---
- name: Install OpenJDK via Homebrew
  ansible.builtin.command: "{{ homebrew_bin_path }}/brew list --formula {{ item }}"
  loop:
    - "{{ android_jdk_formula }}"
    - gradle
  register: android_formula_checks
  failed_when: false
  changed_when: false
  environment:
    PATH: "{{ homebrew_bin_path }}:{{ ansible_env.PATH }}"

- name: Install missing Android build Homebrew formulas
  ansible.builtin.command: "{{ homebrew_bin_path }}/brew install {{ item.item }}"
  loop: "{{ android_formula_checks.results }}"
  when:
    - item.rc != 0
    - not ansible_check_mode
  environment:
    PATH: "{{ homebrew_bin_path }}:{{ ansible_env.PATH }}"

- name: Install Android Commandline Tools Cask
  ansible.builtin.command: "{{ homebrew_bin_path }}/brew list --cask android-commandlinetools"
  register: android_cask_check
  failed_when: false
  changed_when: false
  environment:
    PATH: "{{ homebrew_bin_path }}:{{ ansible_env.PATH }}"

- name: Install Android Commandline Tools cask when missing
  ansible.builtin.command: "{{ homebrew_bin_path }}/brew install --cask android-commandlinetools"
  when:
    - android_cask_check.rc != 0
    - not ansible_check_mode
  environment:
    PATH: "{{ homebrew_bin_path }}:{{ ansible_env.PATH }}"

- name: Ensure Android SDK Directory Structure Exists
  ansible.builtin.file:
    path: "{{ android_sdk_root }}"
    state: directory
    owner: "{{ mac_automation_user }}"
    mode: '0755'

- name: Configure ANDROID_HOME and JAVA_HOME in user environment (.zprofile)
  ansible.builtin.blockinfile:
    path: "/Users/{{ mac_automation_user }}/.zprofile"
    create: true
    owner: "{{ mac_automation_user }}"
    mode: '0644'
    block: |
      export JAVA_HOME="{{ homebrew_prefix }}/opt/{{ android_jdk_formula }}"
      export ANDROID_HOME="{{ android_sdk_root }}"
      export ANDROID_SDK_ROOT="{{ android_sdk_root }}"
      export PATH="$JAVA_HOME/bin:$ANDROID_HOME/cmdline-tools/latest/bin:$ANDROID_HOME/platform-tools:$PATH"

- name: Accept Android SDK Licenses
  ansible.builtin.shell: |
    yes | {{ homebrew_bin_path }}/sdkmanager --sdk_root={{ android_sdk_root }} --licenses
  environment:
    JAVA_HOME: "{{ homebrew_prefix }}/opt/{{ android_jdk_formula }}"
    PATH: "{{ homebrew_bin_path }}:{{ ansible_env.PATH }}"
  changed_when: false

- name: Collect installed Android SDK packages
  ansible.builtin.command: "{{ homebrew_bin_path }}/sdkmanager --sdk_root={{ android_sdk_root }} --list_installed"
  register: android_sdk_installed
  environment:
    JAVA_HOME: "{{ homebrew_prefix }}/opt/{{ android_jdk_formula }}"
    PATH: "{{ homebrew_bin_path }}:{{ ansible_env.PATH }}"
  changed_when: false

- name: Install Android SDK Packages via sdkmanager
  ansible.builtin.shell: |
    {{ homebrew_bin_path }}/sdkmanager --sdk_root={{ android_sdk_root }} "{{ item }}"
  loop: "{{ android_sdk_packages }}"
  environment:
    JAVA_HOME: "{{ homebrew_prefix }}/opt/{{ android_jdk_formula }}"
    PATH: "{{ homebrew_bin_path }}:{{ ansible_env.PATH }}"
  when:
    - android_sdk_installed.stdout is not search('(?m)^' ~ (item | regex_escape) ~ '\\s*\\|')
    - not ansible_check_mode

- name: Include Android Verification Tasks
  ansible.builtin.include_tasks: verify.yml
