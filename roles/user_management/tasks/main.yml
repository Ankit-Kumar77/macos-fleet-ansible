---
- name: Ensure target primary automation user exists (macOS native dscl)
  ansible.builtin.command: "dscl . -read /Users/{{ mac_automation_user }}"
  register: primary_user_check
  failed_when: false
  changed_when: false

- name: Create primary automation user account on macOS (requires sudo)
  ansible.builtin.command: >
    sysadminctl -addUser {{ mac_automation_user }}
    -fullName "Automation Service Account"
    -shell /bin/zsh
    -admin
  become: true
  when: primary_user_check.rc != 0

- name: Add primary automation user to developer group for Xcode build access
  ansible.builtin.command: "dseditgroup -o edit -a {{ mac_automation_user }} -t user {{ mac_developer_group }}"
  become: true
  changed_when: false

- name: Dynamically manage additional user accounts (if defined in variables)
  ansible.builtin.include_tasks: create_user.yml
  loop: "{{ mac_additional_users }}"
  loop_control:
    loop_var: user_item
  when: mac_additional_users is defined and mac_additional_users | length > 0

- name: Ensure SSH directory exists for primary user
  ansible.builtin.file:
    path: "/Users/{{ mac_automation_user }}/.ssh"
    state: directory
    owner: "{{ mac_automation_user }}"
    mode: '0700'

- name: Ensure environment configuration (.zshrc) is configured
  ansible.builtin.blockinfile:
    path: "/Users/{{ mac_automation_user }}/.zshrc"
    create: true
    owner: "{{ mac_automation_user }}"
    mode: '0644'
    block: |
      # Universal macOS Automation Environment
      export PATH="/opt/homebrew/bin:/usr/local/bin:$PATH"
      export LANG="en_US.UTF-8"
      export LC_ALL="en_US.UTF-8"

- name: Include User Management Verification Tasks
  ansible.builtin.include_tasks: verify.yml
